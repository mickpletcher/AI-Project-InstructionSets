name: Documentation or accessibility
description: Improve setup instructions, clarity, or accessibility.
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not post secrets or vulnerability details; see SECURITY.md."
  - type: input
    id: target
    attributes:
      label: Instruction set, host, and version
      description: Include the repository path and commit if relevant.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the goal or problem, expected behavior, actual behavior, and reproducible steps where applicable.
    validations:
      required: true
